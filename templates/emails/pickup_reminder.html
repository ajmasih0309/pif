{% extends 'emails/layout.html' %}
{% block message %}
<h1 style="font-size:24px;">A reminder about your bike pickup</h1>
<p>Hello,</p>
<p>This is a reminder to collect the bike{% if recipient_name %} for <strong>{{ recipient_name }}</strong>{% endif %} by <strong>{{ deadline }}</strong>.</p>
<p>If you need help arranging pickup, please contact our team.</p>
{% endblock %}
