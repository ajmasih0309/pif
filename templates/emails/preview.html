<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Email preview — {{ subject }}</title></head>
<body style="font-family:Arial,sans-serif;margin:24px;">
<h1 style="font-size:22px;">Local email preview — nothing was sent</h1>
<dl><dt>Subject</dt><dd>{{ subject }}</dd><dt>Intended recipient</dt><dd>{{ intended_recipient or 'Not provided' }}</dd></dl>
<iframe title="Email content" sandbox="" referrerpolicy="no-referrer" srcdoc="{{ email_html }}" style="width:100%;height:600px;border:1px solid #aaa;"></iframe>
</body></html>
