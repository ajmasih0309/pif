{% extends "base.html" %}

<!-- Override the page tab title -->
{% block title %}Login - PIF Portal{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="marker-panel p-4 p-sm-5 shadow-sm">
            <h1 class="chalk-header mb-4">Login</h1>
                
                <!-- Login Form -->
                <form action="{{ url_for('login') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token('login') }}">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold fs-5">Username</label>
                        <input type="text" class="form-control shadow-sm" id="username" name="username" required autofocus>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold fs-5">Password</label>
                        <input type="password" class="form-control shadow-sm" id="password" name="password" required>
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold">
                            Log In
                        </button>
                    </div>
                    
                </form>
        </div>
    </div>
</div>
{% endblock %}
