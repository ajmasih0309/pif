name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Test Suite & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl

      - name: Verify Python syntax compilation
        run: |
          python -m compileall -q .

      - name: Run Python unit and integration tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          EMAIL_MODE: "disabled"
          EMAIL_LIVE_ENABLED: "false"
          EMAIL_REMINDERS_ENABLED: "false"
          DB_PATH: "/tmp/pif-ci-test.db"
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  node-tests:
    name: Node Order Actions Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run Node test runner
        run: |
          node --test tests/test_order_actions.cjs

  whitespace-check:
    name: Git Whitespace & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check git whitespace errors
        run: |
          git diff --check HEAD~1 2>/dev/null || git diff --check
